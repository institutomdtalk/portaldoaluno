<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071729">
<title>MD Talk — Sem conexão</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px;background:radial-gradient(circle at 20% 10%,#143b59 0,transparent 45%),linear-gradient(135deg,#071729,#0c2238 65%,#123655);color:#f9f6f0;font:400 16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  main{width:min(100%,480px);text-align:center;padding:36px 24px 40px;border:1px solid #ffffff24;border-radius:28px;background:#ffffff09;box-shadow:0 30px 80px #0003}
  img{width:84px;height:84px;border-radius:17px}
  h1{font:400 clamp(26px,6vw,37px)/1.2 Georgia,serif;margin:25px 0 16px}
  p{color:#c2d0dc;margin:0 auto 28px;max-width:340px;font-size:14px}
  button{border:1px solid #d9c49e;background:#e7d5ae;color:#11283a;border-radius:999px;padding:14px 27px;font:600 13px system-ui;cursor:pointer;min-height:48px}
  button:focus-visible{outline:3px solid #fff;outline-offset:4px}
  small{display:block;margin-top:28px;color:#95a9b9;letter-spacing:.12em;font-size:10px;text-transform:uppercase}
</style>
</head>
<body>
<main>
<img src="./icons/apple-touch-icon.png" alt="Marca MD Talk">
<h1>Estamos sem conexão.</h1>
<p>Para acessar suas aulas, materiais, calendário e progresso, conecte-se à internet e tente novamente.</p>
<button onclick="location.reload()" type="button">Tentar novamente</button>
<small>MD Talk · Portal do Aluno</small>
</main>
</body>
</html>
