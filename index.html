const loginFrame=document.getElementById('loginFrame');
const portalFrame=document.getElementById('portalFrame');
const mask=document.getElementById('transitionMask');

function decodeUtf8(b64){
  const bin=atob(b64), bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
const LOGIN_HTML=decodeUtf8(LOGIN_B64);
const PORTAL_HTML=decodeUtf8(PORTAL_B64);

function setLoginStorage(login,remember,aluno,avisos){
  sessionStorage.setItem('md_login',login);
  sessionStorage.setItem('md_student',JSON.stringify(aluno||{}));
  sessionStorage.setItem('md_avisos',JSON.stringify(avisos||[]));

  if(remember){
    localStorage.setItem('md_login',login);
    localStorage.setItem('md_student',JSON.stringify(aluno||{}));
    localStorage.setItem('md_avisos',JSON.stringify(avisos||[]));
  }else{
    localStorage.removeItem('md_login');
    localStorage.removeItem('md_student');
    localStorage.removeItem('md_avisos');
  }
}

function clearLoginStorage(){
  sessionStorage.removeItem('md_login');
  sessionStorage.removeItem('md_student');
  sessionStorage.removeItem('md_avisos');
  localStorage.removeItem('md_login');
  localStorage.removeItem('md_student');
  localStorage.removeItem('md_avisos');
  localStorage.removeItem('mdtalk_login');
}

function loadLogin(){
  loginFrame.srcdoc=LOGIN_HTML;
}

function loadPortal(){
  // Load only after md_login is available so the portal receives the authenticated student login.
  portalFrame.srcdoc=PORTAL_HTML;
}

function openPortal(){
  mask.classList.add('show');
  loadPortal();
  window.setTimeout(()=>{
    document.body.classList.add('portal-open');
    mask.classList.remove('show');
  },180);
}

function backToLogin(){
  mask.classList.add('show');
  clearLoginStorage();
  document.body.classList.remove('portal-open');
  portalFrame.srcdoc='';
  loadLogin();
  window.setTimeout(()=>mask.classList.remove('show'),180);
}

window.addEventListener('message',e=>{
  const msg=e.data||{};
  if(msg.type==='mdtalk:login:success'){
    const login=String(msg.login||'').trim();
    if(!login) return;
    setLoginStorage(login,Boolean(msg.remember),msg.aluno||{},msg.avisos||[]);
    openPortal();
  }
  if(msg.type==='mdtalk:portal:logout'){
    backToLogin();
  }
});

const rememberedLogin=sessionStorage.getItem('md_login')||localStorage.getItem('md_login');
const rememberedStudent=sessionStorage.getItem('md_student')||localStorage.getItem('md_student');
if(rememberedLogin && rememberedStudent){
  try{
    const parsed=JSON.parse(rememberedStudent);
    if(parsed && (parsed.login||rememberedLogin)){
      sessionStorage.setItem('md_login',rememberedLogin);
      sessionStorage.setItem('md_student',rememberedStudent);
      const av=localStorage.getItem('md_avisos');
      if(av && !sessionStorage.getItem('md_avisos')) sessionStorage.setItem('md_avisos',av);
      openPortal();
    }else loadLogin();
  }catch(e){loadLogin();}
}else{
  loadLogin();
}
</script>
